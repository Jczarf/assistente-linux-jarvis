[project]
name = "assistente-linux-jarvis"
version = "1.2.0"
description = "Assistente desktop para Linux com Gemini, ferramentas locais, memória SQLite e interface PySide6."
requires-python = ">=3.11"
authors = [{ name = "Júlio Cézar" }]
readme = "README.md"
dependencies = [
  "google-genai>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "psutil>=6.0.0,<8.0.0",
  "PySide6>=6.7.0,<7.0.0",
]
