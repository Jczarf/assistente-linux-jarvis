name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bibliotecas Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Segurança da árvore pública
        run: python scripts/check_public_safety.py
      - name: Compilação
        run: python -m compileall -q jarvis main.py
      - name: Smoke test da GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from jarvis.gui import system_snapshot; s = system_snapshot(); assert 'os' in s and 'memory' in s"
      - name: Testes
        run: python -m pytest -q
